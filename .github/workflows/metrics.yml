name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 2 * * *"   # Runs daily at 2am UTC
  workflow_dispatch:        # Allows manual trigger from Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # ── Stats card (commits, stars, PRs, issues) ──────────────────────
      - name: Stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics-stats.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          config_output: svg
          config_display: regular

      # ── Top languages card ────────────────────────────────────────────
      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          config_timezone: Asia/Kolkata

      # ── Streak card (uses streak-stats service) ───────────────────────
      # Streak is fetched at render time from streak-stats.demolab.com
      # No action needed — it's embedded directly in the README

